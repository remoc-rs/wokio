[package]
name = "wokio"
version = "0.1.0"
description = "🕸️ Tokio API for the web — async tasks and timers on browsers and web workers."
keywords = ["tokio", "wasm", "web", "async", "browser"]
categories = ["asynchronous", "wasm", "web-programming"]
readme = "README.md"

edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/remoc-rs/wokio/"
authors = ["Sebastian Urban <surban@surban.net>"]


[features]
default = []

# Enables the web backend on WebAssembly targets.
web = ["dep:js-sys", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:sync_wrapper"]

# Enables task naming on native targets.
#
# Task names are only applied when the crate is additionally built with
# `RUSTFLAGS=--cfg tokio_unstable`; otherwise they are silently dropped.
task-names = ["tokio/tracing"]


[dependencies]
futures = { version = "0.3.31", default-features = false, features = ["std"] }
pin-project-lite = "0.2"
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.29"

# web feature
sync_wrapper = { version = "1.0", optional = true }
js-sys = { version = "0.3.72", optional = true }
web-sys = { version = "0.3.72", features = ["Window", "WorkerGlobalScope", "Performance"], optional = true }
wasm-bindgen = { version = "0.2.95", optional = true }
wasm-bindgen-futures = { version = "0.4.45", optional = true }


[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3.45"


[package.metadata.docs.rs]
# Document the web backend by default, since on native every item is a
# re-export of its Tokio counterpart.
default-target = "wasm32-unknown-unknown"
targets = ["x86_64-unknown-linux-gnu"]
features = ["web"]
rustdoc-args = ["--cfg", "docsrs"]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }


[patch.crates-io]

#### for WASI on the web (wasm32-wasip1-threads target with `web` feature):
